name: qc_control
description: "Goldiran Quality Control System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/goldiran_logo.png